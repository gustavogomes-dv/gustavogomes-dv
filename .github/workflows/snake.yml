name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            "dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#f472d0&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39"
            "dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f472d0&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353"
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
